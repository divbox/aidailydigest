<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY.DIGEST.EXE — August 4, 2026</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;

  --color-bg-page:    #f5f5f3;
  --color-bg-surface: #ffffff;
  --color-text-primary:   #1a1a1a;
  --color-text-secondary: #555555;
  --color-text-muted:     #999999;
  --color-border:         #e8e8e5;
  --color-border-light:   #f0f0ee;

  --cat-safety:      #E24B4A;
  --cat-safety-text: #991b1b;
  --cat-tools:       #1D9E75;
  --cat-tools-text:  #065f46;
  --cat-models:      #378ADD;
  --cat-models-text: #1e40af;
  --cat-biz:         #BA7517;
  --cat-biz-text:    #78350f;

  --src-importai-bg:      #F3F0FF;
  --src-importai-text:    #4C3D99;
  --src-importai-border:  #C4B5F4;
  --src-rundown-bg:       #F0FDF4;
  --src-rundown-text:     #166534;
  --src-rundown-border:   #86EFAC;
  --src-tldr-bg:          #FFF7ED;
  --src-tldr-text:        #9A3412;
  --src-tldr-border:      #FDBA74;
  --src-interconnects-bg:     #F0F9FF;
  --src-interconnects-text:   #0C4A6E;
  --src-interconnects-border: #7DD3FC;
  --src-alphasignal-bg:     #FDF4FF;
  --src-alphasignal-text:   #6B21A8;
  --src-alphasignal-border: #D8B4FE;
  --src-thebatch-bg:        #F0FDF4;
  --src-thebatch-text:      #14532D;
  --src-thebatch-border:    #6EE7B7;
  --src-latentspace-bg:     #FFF1F2;
  --src-latentspace-text:   #881337;
  --src-latentspace-border: #FDA4AF;

  --signal-bg:     #FEF3C7;
  --signal-text:   #92400E;
  --signal-border: #FCD34D;

  --text-xs:   11px;
  --text-sm:   13px;
  --text-base: 15px;
  --text-lg:   18px;
  --text-xl:   24px;
  --text-2xl:  32px;

  --leading-tight:   1.3;
  --leading-base:    1.5;
  --leading-relaxed: 1.68;

  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   10px;
  --radius-pill: 999px;

  --page-width: 820px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--color-bg-page);
  color: var(--color-text-primary);
  line-height: var(--leading-base);
}

.page {
  max-width: var(--page-width);
  margin: 0 auto;
  background: var(--color-bg-surface);
  min-height: 100vh;
  border-left: 1px solid var(--color-border);
  border-right: 1px solid var(--color-border);
}

/* Header */
.header {
  padding: 1.75rem 2rem 1.25rem;
  background: var(--color-bg-surface);
  text-align: center;
}
.header-title {
  font-family: var(--font-mono);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-text-primary);
  line-height: var(--leading-tight);
}
.header-subtitle {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--color-text-secondary);
  margin-top: 4px;
  line-height: var(--leading-base);
}
.header-date {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-top: 3px;
}
.header-rule {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: 12px 0;
}
.header-meta {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.03em;
}

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-surface);
  padding: 0 2rem;
}
.tab-btn {
  padding: 11px 16px;
  font-size: var(--text-sm);
  font-family: var(--font-sans);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  color: var(--color-text-muted);
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn.active {
  border-bottom-color: var(--color-text-primary);
  color: var(--color-text-primary);
  font-weight: 500;
}
.tab-btn:hover:not(.active) { color: var(--color-text-secondary); }

/* Tab content */
.tab-content {
  display: none;
  padding: 1.5rem 2rem 3rem;
}
.tab-content.active { display: block; }

/* Source filter bar */
.source-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 2rem;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-surface);
}
.filter-pill {
  font-size: var(--text-xs);
  padding: 3px 11px;
  border-radius: var(--radius-pill);
  border: 1px solid;
  cursor: pointer;
  background: none;
  font-family: var(--font-sans);
  transition: opacity 0.15s, box-shadow 0.15s;
  opacity: 0.7;
}
.filter-pill:hover { opacity: 1; }
.filter-pill.active { opacity: 1; box-shadow: 0 0 0 2px currentColor; }

.pill-importai      { background: var(--src-importai-bg);      color: var(--src-importai-text);      border-color: var(--src-importai-border); }
.pill-rundown       { background: var(--src-rundown-bg);       color: var(--src-rundown-text);       border-color: var(--src-rundown-border); }
.pill-tldr          { background: var(--src-tldr-bg);          color: var(--src-tldr-text);          border-color: var(--src-tldr-border); }
.pill-interconnects { background: var(--src-interconnects-bg); color: var(--src-interconnects-text); border-color: var(--src-interconnects-border); }
.pill-alphasignal   { background: var(--src-alphasignal-bg);   color: var(--src-alphasignal-text);   border-color: var(--src-alphasignal-border); }
.pill-thebatch      { background: var(--src-thebatch-bg);      color: var(--src-thebatch-text);      border-color: var(--src-thebatch-border); }
.pill-latentspace   { background: var(--src-latentspace-bg);   color: var(--src-latentspace-text);   border-color: var(--src-latentspace-border); }

/* Category sections */
.category-section { margin-bottom: 2rem; }
.cat-header {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--color-border-light);
  margin-bottom: 0;
}
.cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.cat-name {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* Stories */
.story {
  padding: 16px 0 14px;
  border-bottom: 1px solid var(--color-border-light);
  display: flex;
  gap: 14px;
  transition: opacity 0.2s;
}
.story:last-child { border-bottom: none; }
.story-bar {
  width: 3px;
  border-radius: 0;
  flex-shrink: 0;
  align-self: stretch;
  min-height: 52px;
}
.story-inner { flex: 1; }
.story-badges {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.signal-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--signal-bg);
  color: var(--signal-text);
  border: 1px solid var(--signal-border);
  font-weight: 500;
}
.story-title {
  font-size: var(--text-base);
  font-weight: 500;
  margin-bottom: 5px;
  line-height: var(--leading-tight);
}
.story-title a { color: inherit; text-decoration: none; }
.story-title a:hover { text-decoration: underline; color: #1d4ed8; }
.story-summary {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  line-height: var(--leading-relaxed);
  margin-bottom: 9px;
}
.story-sources { display: flex; gap: 5px; flex-wrap: wrap; }
.src-tag {
  font-size: var(--text-xs);
  padding: 2px 9px;
  border-radius: var(--radius-pill);
  border: 1px solid;
}
.src-tag.importai      { background: var(--src-importai-bg);      color: var(--src-importai-text);      border-color: var(--src-importai-border); }
.src-tag.rundown       { background: var(--src-rundown-bg);       color: var(--src-rundown-text);       border-color: var(--src-rundown-border); }
.src-tag.tldr          { background: var(--src-tldr-bg);          color: var(--src-tldr-text);          border-color: var(--src-tldr-border); }
.src-tag.interconnects { background: var(--src-interconnects-bg); color: var(--src-interconnects-text); border-color: var(--src-interconnects-border); }
.src-tag.alphasignal   { background: var(--src-alphasignal-bg);   color: var(--src-alphasignal-text);   border-color: var(--src-alphasignal-border); }
.src-tag.thebatch      { background: var(--src-thebatch-bg);      color: var(--src-thebatch-text);      border-color: var(--src-thebatch-border); }
.src-tag.latentspace   { background: var(--src-latentspace-bg);   color: var(--src-latentspace-text);   border-color: var(--src-latentspace-border); }

/* Category color helpers */
.dot-safety { background: var(--cat-safety); }
.txt-safety { color: var(--cat-safety-text); }
.bar-safety { background: var(--cat-safety); }
.dot-tools  { background: var(--cat-tools); }
.txt-tools  { color: var(--cat-tools-text); }
.bar-tools  { background: var(--cat-tools); }
.dot-models { background: var(--cat-models); }
.txt-models { color: var(--cat-models-text); }
.bar-models { background: var(--cat-models); }
.dot-biz    { background: var(--cat-biz); }
.txt-biz    { color: var(--cat-biz-text); }
.bar-biz    { background: var(--cat-biz); }

/* Quiet day notice */
.quiet-day {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  font-style: italic;
  padding: 1rem 0;
}

/* Deep dive cards */
.dd-section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--color-text-muted);
  margin-bottom: 10px;
  margin-top: 1.75rem;
}
.dd-section-label:first-child { margin-top: 0; }
.dd-card {
  background: var(--color-bg-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  padding: 1.25rem 1.5rem;
  margin-bottom: 12px;
}
.dd-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.dd-title {
  font-size: var(--text-base);
  font-weight: 500;
  line-height: var(--leading-tight);
}
.dd-title a { color: inherit; text-decoration: none; }
.dd-title a:hover { text-decoration: underline; color: #1d4ed8; }
.dd-src {
  font-size: var(--text-xs);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid;
  flex-shrink: 0;
}
.dd-src.importai      { background: var(--src-importai-bg);      color: var(--src-importai-text);      border-color: var(--src-importai-border); }
.dd-src.rundown       { background: var(--src-rundown-bg);       color: var(--src-rundown-text);       border-color: var(--src-rundown-border); }
.dd-src.tldr          { background: var(--src-tldr-bg);          color: var(--src-tldr-text);          border-color: var(--src-tldr-border); }
.dd-src.interconnects { background: var(--src-interconnects-bg); color: var(--src-interconnects-text); border-color: var(--src-interconnects-border); }
.dd-src.alphasignal   { background: var(--src-alphasignal-bg);   color: var(--src-alphasignal-text);   border-color: var(--src-alphasignal-border); }
.dd-src.thebatch      { background: var(--src-thebatch-bg);      color: var(--src-thebatch-text);      border-color: var(--src-thebatch-border); }
.dd-src.latentspace   { background: var(--src-latentspace-bg);   color: var(--src-latentspace-text);   border-color: var(--src-latentspace-border); }
.dd-body {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  line-height: var(--leading-relaxed);
}
.dd-body p { margin-bottom: 8px; }
.dd-body p:last-child { margin-bottom: 0; }
.dd-body a { color: #1d4ed8; }
.dd-body strong { color: var(--color-text-primary); font-weight: 500; }
</style>
</head>
